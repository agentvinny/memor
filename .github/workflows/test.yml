name: test
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: pip install uv
      - name: Sync environment
        run: uv sync --frozen
      - name: Run tests
        run: uv run pytest
        env:
          # keep tests hermetic: no real store, no LLM
          MEMOR_DATA_DIR: /tmp/memor-ci-store
          ANTHROPIC_API_KEY: ""